<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Gustavorodriguezpc">
<title>Portfolio Card</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#fff;color:#111}
body{font:12px/1.35 Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:20px}
.window{width:min(390px,100%);border:1px solid #777;border-radius:9px;box-shadow:0 12px 36px rgba(0,0,0,.16);overflow:hidden;background:#eee}
.titlebar{height:30px;border-bottom:1px solid #888;background:#eee;display:grid;grid-template-columns:65px 1fr 65px;align-items:center}
.dots{padding-left:10px;letter-spacing:3px;color:#777}
.title{text-align:center;font:700 12px Georgia,"Times New Roman",serif}
.body{background:#fff;padding:30px 26px 25px}
.eyebrow{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:9px}
h1{font:normal 34px/1 Georgia,"Times New Roman",serif;margin:0 0 9px}
p{margin:0 0 23px;color:#444}
label{display:block;font-size:9px;font-weight:bold;text-transform:uppercase;letter-spacing:.09em;margin:0 0 5px}
input{width:100%;height:36px;border:1px solid #777;border-radius:3px;padding:7px 9px;font:14px Arial,sans-serif;background:#fff;color:#111}
input:focus{outline:2px solid #111;outline-offset:1px}
button{margin-top:17px;width:100%;height:36px;border:1px solid #666;border-radius:4px;background:#eee;color:#111;font-weight:bold;cursor:pointer}
button:hover{background:#ddd}
.hint{margin-top:10px;font-size:10px;color:#666}
.error{display:none;margin:0 0 13px;padding:8px;border:1px solid #8b1e1e;color:#8b1e1e;background:#fff;font-weight:bold}
.error.show{display:block}
.footer{text-align:center;margin-top:13px;color:#777;font-size:9px}
</style>
</head>
<body>
<div>
  <main class="window">
    <div class="titlebar">
      <div class="dots">● ● ●</div>
      <div class="title">Portfolio Card</div>
      <div></div>
    </div>
    <div class="body">
      <div class="eyebrow">One thing before the portfolio</div>
      <h1>Enter the password.</h1>
      <p>There is only one thing you need to remember.</p>

      <div class="error" id="err">Not quite. Try the name again.</div>

      <form method="POST" action="/login">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          autofocus
          required>
        <button type="submit">Open portfolio</button>
      </form>

      <div class="hint">Hint: my first name.</div>
    </div>
  </main>

  <div class="footer">ESP32 · local portfolio</div>
</div>

<script>
const q = new URLSearchParams(location.search);
if (q.get("e") === "1") {
  document.getElementById("err").classList.add("show");
}
</script>
</body>
</html>
